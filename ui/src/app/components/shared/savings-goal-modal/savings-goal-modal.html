<div class="modal-box">
  <div class="modal-header">
    <h2 class="modal-title">{{ title }}</h2>
    <button class="btn-ghost-close" (click)="close()"><mat-icon>close</mat-icon></button>
  </div>
  <div class="form-stack">
    <div>
      <label class="form-label">Nombre</label>
      <input class="input-field" [(ngModel)]="form.name" placeholder="Ej: Vacaciones, Carro...">
    </div>
    <div>
      <label class="form-label">Ícono Material</label>
      <div style="display:flex;gap:10px;align-items:center;">
        <input class="input-field" style="flex:1;" [(ngModel)]="form.icon" placeholder="Ej: beach_access, directions_car">
        <div class="icon-box-md" [style.background]="form.color + '22'">
          <mat-icon [style.color]="form.color">{{ form.icon || 'savings' }}</mat-icon>
        </div>
      </div>
    </div>
    <div>
      <label class="form-label">Color</label>
      <div style="display:flex;flex-wrap:wrap;gap:8px;">
        @for (c of palette; track c) {
          <button class="color-swatch" (click)="form.color = c" [style.background]="c"
            [style.border]="form.color === c ? '3px solid #fff' : '3px solid transparent'"
            [style.transform]="form.color === c ? 'scale(1.15)' : 'scale(1)'">
          </button>
        }
      </div>
    </div>
    <div>
      <label class="form-label">Monto objetivo (COP)</label>
      <input class="input-field" type="number" min="0" [(ngModel)]="form.targetAmount" placeholder="Ej: 5000000">
    </div>
    <div>
      <label class="form-label">Fecha objetivo (opcional)</label>
      <input class="input-field" type="date" [(ngModel)]="form.targetDate">
    </div>
  </div>
  <button class="btn-primary btn-full" style="margin-top:24px;" (click)="save()" [disabled]="saving()">
    <mat-icon class="icon-md">{{ saving() ? 'sync' : 'check' }}</mat-icon>
    {{ saving() ? 'Guardando...' : title }}
  </button>
</div>
